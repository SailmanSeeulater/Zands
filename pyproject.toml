[project]
name = "zands"
version = "0.1.0"
description = "Local news RAG: ingest RSS feeds into SQLite, search them, answer with a local Ollama model."
authors = [
    { name = "Perfect Phanitchaleun", email = "latersailor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasette>=0.65.6",
    "feedparser>=6.0",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "sqlite-vec>=0.1.9",
    "trafilatura>=1.12",
]

[project.scripts]
zands = "zands.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
