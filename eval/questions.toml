# Known-answer test set for `zands eval`.
#
# Each [[question]] has:
#   q          the question, as a user would ask it
#   expect_url substrings of article URLs; retrieval is a hit if any top-k chunk comes from a matching article
#   answer_any (optional) words/phrases; with `zands eval --answers` the model's answer must contain one
#   style      "keyword" (shares words with the headline) or "paraphrase" (deliberately avoids them)
#
# Built from the articles ingested on 2026-11-24. Articles are never deleted, so these stay valid
# for this database; a question whose articles aren't in the database is reported as "missing"
# rather than as a miss. Add new questions as the news moves on; don't tune retrieval against
# questions written after looking at what it retrieves.

[[question]]
q = "Which Star Trek actor died, and how old was he?"
expect_url = ["star-trek-star-patrick-stewart-dies"]
answer_any = ["86"]
style = "keyword"

[[question]]
q = "When does Bangladesh's ousted former prime minister plan to come home?"
expect_url = ["sheikh-hasina-plans-to-return"]
answer_any = ["December 16", "16 December", "Dec 16"]
style = "paraphrase"

[[question]]
q = "What did Baghdad order about oil production in the semi-autonomous north?"
expect_url = ["iraq-orders-takeover-of-oilfields"]
answer_any = ["Kurdish", "Kurdistan"]
style = "paraphrase"

