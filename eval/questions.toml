# Known-answer test set for `zands eval`.
#
# Each question block has:
#   q          the question, as a user would ask it
#   expect_url substrings of article URLs that answer it
#   same_story (optional) terms that identify the story; "a|b" means either. A retrieved chunk that
#              contains every term also counts as a hit, so the question keeps working when other
#              outlets (or later articles) cover the same story. `zands eval --list` marks those hits "~".
#   answer_any (optional) words/phrases; with `zands eval --answers` the model's answer must contain one
#   style      "keyword" (shares words with the headline) or "paraphrase" (deliberately avoids them)
#
# Questions 1-20 were written from the articles ingested on the morning of 2026-11-24, 21-32 from
# that afternoon and evening's ingests. Articles are never deleted, so these stay valid for this
# database; a question with no matching article is reported as "missing" rather than as a miss.
# Add new questions as the news moves on; don't tune retrieval against questions written after
# looking at what it retrieves.

[[question]]
q = "Which Star Trek actor died, and how old was he?"
expect_url = ["star-trek-star-patrick-stewart-dies"]
same_story = ["Patrick Stewart", "died|dies|death", "86"]
answer_any = ["86"]
style = "keyword"

